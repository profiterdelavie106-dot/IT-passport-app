<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITパスポート 5分道場</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- ホーム画面 -->
        <section id="home-screen" class="screen active">
            <div class="header">
                <h2>ITパスポート 5分道場</h2>
                <div class="stats">
                    <button id="open-dict-btn" class="icon-btn" title="用語集を開く">
                        <span class="material-icons">menu_book</span>
                    </button>
                    <span class="material-icons">local_fire_department</span>
                    <span id="streak-count">0日連続</span>
                </div>
            </div>
            <div class="card">
                <!-- JSで動的にボタンが生成されます -->
            </div>
        </section>

        <!-- 用語集画面 -->
        <section id="dictionary-screen" class="screen">
            <div class="header">
                <h2>用語集 (令和8年度)</h2>
                <button id="close-dict-btn" class="icon-btn" title="閉じる">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div id="dictionary-list" class="dictionary-list">
                <!-- JSで動的に用語が生成されます -->
            </div>
        </section>

        <!-- 問題画面 -->
        <section id="quiz-screen" class="screen">
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div class="header-quiz">
                <span id="category-label" class="chip">カテゴリ</span>
                <span id="question-count-label">1/5</span>
            </div>
            <div class="card question-card">
                <p id="question-text">問題文</p>
            </div>
            <div id="options-container"></div>
        </section>

        <!-- 結果画面 -->
        <section id="result-screen" class="screen">
            <div class="header">
                <h2>学習完了！</h2>
            </div>
            <div class="card result-card">
                <span class="material-icons result-icon">emoji_events</span>
                <h3 id="score-text">0 / 0 問 正解</h3>
                <p>よく頑張りました！</p>
                <button id="home-btn" class="btn-secondary">ホームへ戻る</button>
            </div>
        </section>

        <!-- 解説ボトムシート -->
        <div id="explanation-sheet" class="bottom-sheet hidden">
            <h3 id="judgement-text">正解！</h3>
            <p id="explanation-text">解説文</p>
            <button id="next-btn" class="btn-primary">次の問題へ</button>
        </div>
        <div id="overlay" class="hidden"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
